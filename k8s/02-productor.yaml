# 02-productor.yaml
# Deployment + Service LoadBalancer del productor.
# Puntos 3, 5, 6, 7 y 8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productor
spec:
  replicas: 2                        # 2 copias: alta disponibilidad
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0              # nunca retira un pod viejo sin uno nuevo listo
      maxSurge: 1                    # crea 1 pod extra durante la actualización
  selector:
    matchLabels:
      app: productor
  template:
    metadata:
      labels:
        app: productor
    spec:
      containers:
        - name: productor
          image: 674715791320.dkr.ecr.us-east-1.amazonaws.com/agrolink/productor:74e5959   # tag por hash
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agrolink-config
          securityContext:
            runAsNonRoot: true       # Kubernetes verifica que no sea root
            runAsUser: 10001
          resources:                 # punto 6
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          livenessProbe:             # ¿está vivo? si falla, reinicia
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:            # ¿puede atender? depende de Kafka
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: productor
spec:
  type: LoadBalancer                 # balanceador público en AWS (único acceso desde Internet)
  selector:
    app: productor
  ports:
    - port: 80
      targetPort: 8000