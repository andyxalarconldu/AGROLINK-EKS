apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumidor-notificacion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumidor-notificacion
  template:
    metadata:
      labels:
        app: consumidor-notificacion
    spec:
      containers:
        - name: consumidor-notificacion
          image: 674715791320.dkr.ecr.us-east-1.amazonaws.com/agrolink/consumidor-notificacion:74e5959
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agrolink-config
          env:
            - name: DB_PASSWORD        # contraseña desde el Secret
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: consumidor-notificacion
spec:
  type: ClusterIP
  selector:
    app: consumidor-notificacion
  ports:
    - port: 80
      targetPort: 8000